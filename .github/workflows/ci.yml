name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release version is derived from commit messages, so a malformed message
  # silently costs a release. This gate makes that a CI failure instead.
  commits:
    name: Semantic Commits
    runs-on: ubuntu-latest

    # On a pull_request event commitlint asks the API for the commits the PR
    # carries, which the workflow-wide `contents: read` does not cover - the
    # call comes back "Resource not accessible by integration" and the action
    # then crashes on the list it never received.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint needs the history to resolve the range it validates.
          fetch-depth: 0

      # Validates only the commits introduced by this push/PR - the existing
      # non-conventional history is never re-checked. Rules: commitlint.config.mjs
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6

  coding-standards:
    name: Coding Standards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # composer.lock is not committed, so every run resolves and downloads from
      # the network - and `--prefer-dist` has source fallback disabled, so one
      # 504 from api.github.com fails the job outright. Three attempts with a
      # growing pause; a genuine resolution error still fails, three times over.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed (attempt $attempt of 3)"
            sleep $(( attempt * 15 ))
          done
          exit 1

      # EXEC= runs the same Makefile gate a developer runs, natively on the
      # runner (which has PHP + vendor/ but no container). One definition means
      # the CI gate cannot drift from the local one.
      - name: Check coding standards
        run: make lint EXEC=

      # Native functions, classes and constants must be imported in the file header.
      - name: Check global namespace imports
        run: make cs-fixer EXEC=

  static-analysis:
    name: Static Analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # composer.lock is not committed, so every run resolves and downloads from
      # the network - and `--prefer-dist` has source fallback disabled, so one
      # 504 from api.github.com fails the job outright. Three attempts with a
      # growing pause; a genuine resolution error still fails, three times over.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed (attempt $attempt of 3)"
            sleep $(( attempt * 15 ))
          done
          exit 1

      - name: Run PHPStan
        run: make analyse EXEC=

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The suite runs inside the project's OWN image, the same one a developer
      # builds locally. Building it here rather than using a bare `container:`
      # keeps a single definition of what a test environment is - a drifting
      # Dockerfile becomes a CI failure instead of a surprise.
      - name: Build the PHP ${{ matrix.php }} image
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t php-datatypes:${{ matrix.php }} .

      - name: PHP version
        run: docker run --rm php-datatypes:${{ matrix.php }} php -v

      # composer.lock is not committed, so every run resolves and downloads from
      # the network - and `--prefer-dist` has source fallback disabled, so one
      # 504 from api.github.com fails the job outright. Three attempts with a
      # growing pause; a genuine resolution error still fails, three times over.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            docker run --rm -v "$PWD":/app -w /app php-datatypes:${{ matrix.php }} \
              composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed (attempt $attempt of 3)"
            sleep $(( attempt * 15 ))
          done
          exit 1

      - name: Run test suite
        run: |
          docker run --rm -v "$PWD":/app -w /app php-datatypes:${{ matrix.php }} \
            vendor/bin/phpunit

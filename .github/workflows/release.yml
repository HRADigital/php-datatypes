name: Release

on:
  # Gated on CI: this fires only once the CI workflow finishes for a master push,
  # and the job below bails unless it finished green. Triggering on `push` directly
  # would race CI and could tag a red commit.
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ master ]

permissions:
  # Required to create tags and releases.
  contents: write

concurrency:
  # Serialise releases - two overlapping runs would race on the same next version.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The gate. workflow_run fires on failure too, so check the conclusion.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Tag the exact commit CI validated, not whatever master points at now.
        ref: ${{ github.event.workflow_run.head_sha }}
        # semver-action needs full history and all tags to compare against the latest one.
        fetch-depth: 0

    - name: Get Next Version
      id: semver
      uses: ietf-tools/semver-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: master
        # Version comes entirely from the commit messages. EVERY commit that lands
        # on master ships a new version - the version identifies the state of the
        # project, so no push is allowed to leave the released version stale:
        #   major -> a "BREAKING CHANGE:" footer (see note below)
        #   minor -> feat
        #   patch -> everything else, including ci, chore, docs, style and test
        #
        # majorList stays empty on purpose: the action detects a major from the
        # "BREAKING CHANGE:" footer independently of this list, so listing a bare
        # type here would let a routine commit bump the major by accident.
        #
        # NOTE: this action does NOT recognise the "!" suffix (`feat!: ...`) - it
        # only scans parsed commit notes for a "BREAKING CHANGE" title. A breaking
        # change MUST carry the footer, on its own line after a blank line:
        #   BREAKING CHANGE: <what broke + what callers must do>
        majorList: ""
        minorList: "feat"
        patchList: "fix, perf, refactor, revert, build"
        # patchAll makes every commit type not already claimed by minorList or the
        # breaking-change footer count as a patch. patchList above is therefore
        # redundant, and is kept only to document the intent of those types.
        patchAll: true
        # Reached only when the range holds no commit at all (e.g. a re-run), not
        # when the commits are "unreleasable" - the "Report skipped release" step logs it.
        noVersionBumpBehavior: silent
        # If HEAD is already at the latest tag, keep the current version instead of erroring.
        noNewCommitBehavior: current

    - name: Create release
      # Release only when the commits actually earned a bump. Note: the action exposes
      # `current` (not `currentStrict`) - `bump` is the reliable signal here.
      #
      # Test `bump` against the allow-list rather than `!= 'none'`: on the
      # noNewCommitBehavior=current path the action returns early, before it ever sets
      # the `bump` output, so `bump` comes back EMPTY while `nextStrict` still holds the
      # existing tag. A `!= 'none'` check passes there and `gh release create` then dies
      # on a tag that already exists.
      if: ${{ contains(fromJSON('["major","minor","patch"]'), steps.semver.outputs.bump) }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEXT_VERSION: ${{ steps.semver.outputs.nextStrict }}
        TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        echo "Previous: ${{ steps.semver.outputs.current }}"
        echo "Bump:     ${{ steps.semver.outputs.bump }}"
        echo "Next:     ${NEXT_VERSION}"
        # Creates the tag at the validated commit and a release with auto-generated
        # notes (built by GitHub from the commits/PRs since the previous tag).
        gh release create "${NEXT_VERSION}" \
          --target "${TARGET_SHA}" \
          --title "${NEXT_VERSION}" \
          --generate-notes

    - name: Report skipped release
      if: ${{ !contains(fromJSON('["major","minor","patch"]'), steps.semver.outputs.bump) }}
      run: echo "No releasable commit since ${{ steps.semver.outputs.current }} - skipping."
